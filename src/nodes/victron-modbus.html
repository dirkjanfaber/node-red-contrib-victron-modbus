<script type="text/javascript">
(function() {
    // Namespace all functions to avoid global conflicts
    var VictronModbus = {
        buildOption: function(service) {
            if (!service) {
                console.warn('buildOption called with undefined/null service');
                return $('<option/>');
            }
            return $('<option/>').val(service.value).text(service.label).data(service);
        },

        populateSelect: function(selector, services) {
            if (!selector || selector.length === 0) {
                console.error('Invalid selector');
                return;
            }
            if (!services || !Array.isArray(services)) {
                console.error('Invalid services data:', services);
                return;
            }

            selector.empty();
            for (var i = 0; i < services.length; i++) {
                selector.append(VictronModbus.buildOption(services[i]));
            }
            selector.trigger('change');
        },

        fetchSelect: function(label, selected) {
            var selectRoot = (RED.settings.httpNodeRoot || RED.settings.httpAdminRoot || "").replace(/\/$/, "") + '/victron/' + label;
            $.ajax(selectRoot, {
                beforeSend: function(jqXHR) {
                    var auth_tokens = RED.settings.get("auth-tokens");
                    if (auth_tokens) {
                        jqXHR.setRequestHeader("Authorization","Bearer " + auth_tokens.access_token);
                    }
                }
            })
            .done(function(data) {
                if (data && Array.isArray(data)) {
                    VictronModbus.populateSelect($('#node-input-' + label), data);
                    if (selected) {
                        $('#node-input-' + label).val(selected);
                    }
                } else {
                    console.error('Data is not an array:', data);
                    RED.notify('Attributes data format is invalid', 'error');
                }
            })
            .fail(function(err) {
                console.error('Failed to fetch attributes:', err);
                RED.notify('Failed to load attributes. Check console for details.', 'error');
            });
        },

        getNodeLabel: function(node) {
            var altName = RED.nodes.node(node.server) ? (RED.nodes.node(node.server).name || 'Modbus') : 'Modbus';

            if (node.unitid) {
                altName += ': ' + node.unitid;
            }

            if (node.attribute && typeof node.attribute === 'object' && node.attribute.label) {
                altName += ': ' + node.attribute.label.split(':')[1];
            }

            return node.name || altName;
        }
    };

    RED.nodes.registerType('victron-modbus', {
        category: 'Victron Energy',
        color: '#4790d0',
        defaults: {
            name: {value: ""},
            unitid: {value: ""},
            attribute: {value: ""},
            attributesPath: {value: ""},  // Custom path for attributes.csv
            write: {value: false},
            server: {type: 'modbus-client', required: true}
        },
        inputs: 1,
        outputs: 1,
        icon: "victronenergy.svg",
        label: function() {
            return VictronModbus.getNodeLabel(this);
        },
        oneditprepare: function() {
            var selectedValue = '';
            if (this.attribute) {
                if (typeof this.attribute === 'object' && this.attribute.value) {
                    selectedValue = this.attribute.value;
                } else if (typeof this.attribute === 'string') {
                    selectedValue = this.attribute;
                }
            }
            VictronModbus.fetchSelect('attributes', selectedValue);
        },
        oneditsave: function() {
            this.unitid = $('#node-input-unitid').val();
            this.attribute = $('#node-input-attributes').find(':selected').data();
            this.attributesPath = $('#node-input-attributesPath').val();
        }
    });
})();
</script>

<script type="text/html" data-template-name="victron-modbus">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>

        <label for="node-input-server"><i class="icon-globe"></i> <span data-i18n="modbus-contrib.label.server"></span> Server</label>

    </div>
</script>

<script type="text/markdown" data-help-name="victron-modbus">
# Victron Modbus Node

A Node-RED node that utilizes the `node-red-contrib-modbus` code to access Victron Energy devices via Modbus.

## Overview

This node uses the combination of the **Unit ID** and **attribute** to query the Venus device via Modbus.

## Attributes File

The `attributes.csv` file is used for populating the attribute dropdown in the editor. The node searches for this file in the following locations (in order):

1. **Custom path** specified in node configuration
2. **Environment variable** `VICTRON_ATTRIBUTES_PATH`
3. `/opt/victronenergy/dbus-modbustcp/attributes.csv` (Venus OS)
4. `~/.node-red/attributes.csv` (Node-RED user directory)
5. `/config/node-red/attributes.csv` (Home Assistant)
6. `/share/node-red/attributes.csv` (Home Assistant)
7. Other common locations

### Downloading attributes.csv

The file can be downloaded from [GitHub](https://github.com/victronenergy/dbus_modbustcp/blob/master/attributes.csv).

```bash
# Standard Node-RED installation
curl -o ~/.node-red/attributes.csv https://raw.githubusercontent.com/victronenergy/dbus_modbustcp/master/attributes.csv

# Home Assistant add-on
curl -o /config/node-red/attributes.csv https://raw.githubusercontent.com/victronenergy/dbus_modbustcp/master/attributes.csv
```

### Custom Path

If your attributes.csv is in a non-standard location, you can specify a custom path in the node configuration under **Attributes File**.

### Environment Variable

Alternatively, set the environment variable before starting Node-RED:

```bash
export VICTRON_ATTRIBUTES_PATH=/path/to/your/attributes.csv
```

## Configuration

### Unit ID

To retrieve the Unit ID, check the Remote Console:

**Settings → Services → Modbus TCP → Available services**

The Unit ID can be set in the node configuration or dynamically via `msg.unitid`.

### Attribute

The dropdown shows a list of all attributes that a Venus device *can* expose via Modbus. Depending on the connected hardware, these devices actually answer to the attributes.

The attribute can be set in the node configuration or dynamically via `msg.attribute`.

### Writing

If the **Write** checkbox has been set, the input is treated as the value to write to the specified attribute.

## Dynamic Configuration

You can override the configured Unit ID and Attribute at runtime using message properties:

### msg.unitid

Override the Unit ID for this specific request:

```javascript
msg.unitid = "100";
msg.payload = true;  // trigger read/write
return msg;
```

### msg.attribute

Override the attribute for this specific request. The attribute must be in the same format as the configuration:

```javascript
msg.attribute = {
    label: "com.victronenergy.battery:/Dc/0/Voltage",
    value: "259:uint16:1:10:V DC:R"
};
msg.payload = true;  // trigger read
return msg;
```

**Note:** If both `msg.unitid` and `msg.attribute` are provided, they will be used instead of the node's configuration. If only one is provided, it will override just that setting while using the configured value for the other.

## Examples

### Dynamic Unit ID
```javascript
// Read voltage from different battery units
msg.unitid = "225";  // Battery 1
return msg;
```

### Dynamic Attribute
```javascript
// Switch between reading different attributes
msg.attribute = {
    value: "840:int16:1:10:A:R"  // Current instead of Voltage
};
return msg;
```

### Fully Dynamic Query
```javascript
// Query any unit and attribute dynamically
msg.unitid = flow.get("current_unit");
msg.attribute = flow.get("current_attribute");
return msg;
```

## Output

The output is automatically parsed into readable format based on the attribute type (integer, string, enum, etc.). The node status displays the last read or written value for easy monitoring.
</script>
